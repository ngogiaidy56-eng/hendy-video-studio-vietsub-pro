services:
  api-gateway:
    build: .
    command: sh -c "npm run db:migrate && npm run start:api"
    ports: ["127.0.0.1:8787:8787"]
    environment:
      NODE_ENV: production
      PORT: 8787
      SERVE_FRONTEND: "true"
      CORS_ORIGINS: http://localhost:8787,http://localhost:5173,http://localhost:5174
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgres://hendy:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/hendy_studio
      UPLOAD_DIR: /app/storage/uploads
      OUTPUT_DIR: /app/storage/outputs
      API_ACCESS_TOKEN: ${API_ACCESS_TOKEN:?Set a random 32+ byte API_ACCESS_TOKEN in .env}
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:?Set a random 32+ byte ADMIN_API_TOKEN in .env}
      SESSION_SECRET: ${SESSION_SECRET:?Set a random 32+ byte SESSION_SECRET in .env}
      MEDIA_SIGNING_SECRET: ${MEDIA_SIGNING_SECRET:?Set a random 32+ byte MEDIA_SIGNING_SECRET in .env}
      MEDIA_URL_TTL_SECONDS: ${MEDIA_URL_TTL_SECONDS:-3600}
      MAX_TRANSCRIPTION_MB: ${MAX_TRANSCRIPTION_MB:-100}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      WHISPER_API_URL: ${WHISPER_API_URL:-}
      WHISPER_API_TOKEN: ${WHISPER_API_TOKEN:-}
      TTS_API_URL: ${TTS_API_URL:-}
      TTS_API_TOKEN: ${TTS_API_TOKEN:-}
      TTS_MODEL: ${TTS_MODEL:-tts-1}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_REGION: ${R2_REGION:-auto}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      TRUST_PROXY: "false"
    volumes: ["hendy_media:/app/storage"]
    depends_on: [redis, postgres]
    restart: unless-stopped
  ai-worker:
    build: .
    command: npm run start:worker
    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgres://hendy:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/hendy_studio
      UPLOAD_DIR: /app/storage/uploads
      OUTPUT_DIR: /app/storage/outputs
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_REGION: ${R2_REGION:-auto}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      WORKER_CONCURRENCY: 1
    volumes: ["hendy_media:/app/storage"]
    depends_on: [redis, postgres]
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis_data:/data"]
    restart: unless-stopped
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hendy_studio
      POSTGRES_USER: hendy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data", "./database/postgres-rbac:/docker-entrypoint-initdb.d:ro"]
    restart: unless-stopped
  mongodb:
    image: mongo:7
    profiles: ["document-db"]
    ports: ["27017:27017"]
    volumes: ["mongo_data:/data/db"]
    restart: unless-stopped
volumes:
  hendy_media:
  redis_data:
  postgres_data:
  mongo_data:
