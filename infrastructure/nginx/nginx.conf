server {
  listen 8080;
  server_name _;
  client_max_body_size 500m;
  location /health { proxy_pass http://api-gateway:8787/health; proxy_set_header Host $host; }
  location / { proxy_pass http://api-gateway:8787; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
  location /ws/ { proxy_pass http://api-gateway:8787/ws/; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; }
}
