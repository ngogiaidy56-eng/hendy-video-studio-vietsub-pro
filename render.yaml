services:
  - type: web
    name: hendy-server-video-studio-pro-api
    runtime: docker
    plan: starter
    dockerCommand: npm run db:migrate && npm run start:all
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: SERVE_FRONTEND
        value: "true"
      - key: API_ACCESS_TOKEN
        sync: false
      - key: ADMIN_API_TOKEN
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: MEDIA_SIGNING_SECRET
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
      - key: INVITE_BASE_URL
        sync: false
      - key: WHISPER_API_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: RENDER_TIMEOUT_MS
        value: "21600000"
      - key: MEDIA_URL_TTL_SECONDS
        value: "3600"
      - key: MAX_UPLOAD_MB
        value: "500"
      - key: WHISPER_API_TOKEN
        sync: false
      - key: TTS_API_URL
        sync: false
      - key: TTS_API_TOKEN
        sync: false
      - key: TTS_MODEL
        value: tts-1
      - key: MAX_TRANSCRIPTION_MB
        value: "100"
      - key: CORS_ORIGINS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: hendy-video-studio-redis
          property: connectionString
      - key: DATABASE_URL
        fromDatabase:
          name: hendy-video-studio-postgres
          property: connectionString
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: OUTPUT_DIR
        value: /var/data/outputs
    disk:
      name: hendy-media
      mountPath: /var/data
      sizeGB: 10
  - type: keyvalue
    name: hendy-video-studio-redis
    plan: starter
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []
  - type: web
    name: hendy-video-studio-admin
    runtime: static
    plan: starter
    buildCommand: npm install && npm run build --workspace @hendy/admin-web
    staticPublishPath: apps/admin-web/dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_REQUIRE_AUTH
        value: "true"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: hendy-video-studio-studio
    runtime: static
    plan: starter
    buildCommand: npm install && npm run build --workspace @hendy/studio-web
    staticPublishPath: apps/studio-web/dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_REQUIRE_AUTH
        value: "true"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: hendy-video-studio-postgres
    plan: basic-256mb
    databaseName: hendy_studio
    user: hendy
